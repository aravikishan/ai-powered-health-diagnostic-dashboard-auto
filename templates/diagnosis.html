<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Checker</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Symptom Checker</h1>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/diagnosis">Symptom Checker</a>
        <a href="/profile">User Profile</a>
        <a href="/insights">Health Insights</a>
        <a href="/about">About</a>
    </nav>
    <main class="container">
        <div class="card">
            <form id="symptom-form">
                <div class="mb-3">
                    <label for="symptoms" class="form-label">Enter your symptoms:</label>
                    <input type="text" class="form-control" id="symptoms" placeholder="e.g., fever, cough">
                </div>
                <button type="submit" class="btn">Check Diagnosis</button>
            </form>
            <div id="diagnosis-result" class="mt-3"></div>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Health Dashboard</p>
    </footer>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById('symptom-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const symptoms = document.getElementById('symptoms').value.split(',').map(s => s.trim());
            const response = await fetch('/api/diagnose', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(symptoms)
            });
            const data = await response.json();
            document.getElementById('diagnosis-result').innerText = `Diagnosis: ${data.diagnosis}`;
        });
    </script>
</body>
</html>
